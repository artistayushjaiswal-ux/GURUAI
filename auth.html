<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GURUAI â€¢ Login</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,#29205c55,transparent 30%),
        radial-gradient(circle at 80% 80%,#4d1c6350,transparent 30%),
        #070912;
    color:white;
    padding:20px;
}

/* MAIN CARD */

.auth-container{
    width:100%;
    max-width:440px;
}

.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:bold;

    background:linear-gradient(
        135deg,
        #6d5dfc,
        #a855f7
    );

    box-shadow:
        0 15px 45px #6d5dfc45;
}

.brand{
    margin-top:14px;
    font-size:27px;
    font-weight:bold;
    letter-spacing:.5px;
}

.subtitle{
    margin-top:6px;
    color:#737c91;
    font-size:12px;
}

/* CARD */

.card{
    padding:30px;
    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            #121727,
            #0d111d
        );

    border:1px solid #2c3247;

    box-shadow:
        0 25px 80px #00000055;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;

    padding:5px;
    border-radius:12px;
    background:#080b13;

    margin-bottom:25px;
}

.tab{
    padding:11px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#737c91;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    background:#1b2031;
    color:white;
}

/* FORM */

.form{
    display:none;
}

.form.active{
    display:block;
}

.title{
    font-size:21px;
    font-weight:bold;
    margin-bottom:6px;
}

.description{
    color:#737c91;
    font-size:11px;
    line-height:1.5;
    margin-bottom:20px;
}

label{
    display:block;
    color:#9ba3b6;
    font-size:11px;
    margin-bottom:7px;
}

.input-group{
    margin-bottom:15px;
}

input{
    width:100%;
    height:46px;

    border-radius:11px;
    border:1px solid #30364b;

    background:#0a0e18;

    color:white;

    outline:none;

    padding:0 13px;

    font-size:13px;
}

input:focus{
    border-color:#6d5dfc;
    box-shadow:0 0 0 3px #6d5dfc18;
}

input::placeholder{
    color:#51596c;
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:50px;
}

.show-password{
    position:absolute;
    right:7px;
    top:7px;

    width:32px;
    height:32px;

    border:0;
    border-radius:8px;

    background:#171c2a;
    color:#8d95a8;

    cursor:pointer;
}

/* BUTTON */

.submit{
    width:100%;
    height:47px;

    margin-top:5px;

    border:0;
    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #6d5dfc,
            #a855f7
        );

    color:white;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 25px #6d5dfc30;
}

.submit:hover{
    transform:translateY(-1px);
}

/* MESSAGE */

.message{
    display:none;

    margin-top:15px;

    padding:11px;

    border-radius:10px;

    font-size:11px;

    text-align:center;

    background:#121827;

    border:1px solid #30364b;

    color:#9ba3b6;
}

.message.show{
    display:block;
}

/* FOOTER */

.footer{
    text-align:center;

    margin-top:18px;

    color:#51596c;

    font-size:10px;
}

.footer span{
    color:#7770dc;
}

/* MOBILE */

@media(max-width:500px){

    body{
        padding:12px;
    }

    .card{
        padding:22px;
    }

    .logo{
        width:62px;
        height:62px;
        font-size:30px;
    }

    .brand{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="auth-container">

    <div class="logo-area">

        <div class="logo">
            G
        </div>

        <div class="brand">
            GURUAI
        </div>

        <div class="subtitle">
            Your intelligent AI workspace
        </div>

    </div>


    <div class="card">

        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()">
                Login
            </button>

            <button
                class="tab"
                id="signupTab"
                onclick="showSignup()">
                Sign Up
            </button>

        </div>


        <!-- LOGIN -->

        <div
            class="form active"
            id="loginForm">

            <div class="title">
                Welcome back
            </div>

            <div class="description">
                Login to continue using GURUAI.
            </div>


            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email">

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="password-row">

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password">

                    <button
                        class="show-password"
                        onclick="togglePassword('loginPassword',this)">
                        ðŸ‘
                    </button>

                </div>

            </div>


            <button
                class="submit"
                onclick="login()">

                Login to GURUAI

            </button>

        </div>


        <!-- SIGN UP -->

        <div
            class="form"
            id="signupForm">

            <div class="title">
                Create your account
            </div>

            <div class="description">
                Create a local GURUAI account on this device.
            </div>


            <div class="input-group">

                <label>
                    Name
                </label>

                <input
                    id="signupName"
                    type="text"
                    placeholder="Your name"
                    autocomplete="name">

            </div>


            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email">

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="password-row">

                    <input
                        id="signupPassword"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password">

                    <button
                        class="show-password"
                        onclick="togglePassword('signupPassword',this)">
                        ðŸ‘
                    </button>

                </div>

            </div>


            <button
                class="submit"
                onclick="signup()">

                Create GURUAI Account

            </button>

        </div>


        <div
            class="message"
            id="message">
        </div>

    </div>


    <div class="footer">
        GURUAI â€¢ AI Workspace
        <br>
        <span>Cloud AI</span>
    </div>

</div>


<script>

/* SWITCH FORMS */

function showLogin(){

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("signupForm")
        .classList.remove("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

    hideMessage();

}


function showSignup(){

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("loginForm")
        .classList.remove("active");

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    hideMessage();

}


/* MESSAGE */

function showMessage(text){

    const message=
        document.getElementById("message");

    message.textContent=text;

    message.classList.add("show");

}


function hideMessage(){

    document
        .getElementById("message")
        .classList.remove("show");

}


/* PASSWORD */

function togglePassword(id,button){

    const input=
        document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        button.textContent="ðŸ™ˆ";

    }else{

        input.type="password";

        button.textContent="ðŸ‘";

    }

}


/* SIGN UP */

function signup(){

    const name=
        document
        .getElementById("signupName")
        .value
        .trim();

    const email=
        document
        .getElementById("signupEmail")
        .value
        .trim()
        .toLowerCase();

    const password=
        document
        .getElementById("signupPassword")
        .value;


    if(!name || !email || !password){

        showMessage(
            "Please fill in all fields."
        );

        return;

    }


    if(password.length<6){

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;

    }


    const users=
        JSON.parse(
            localStorage.getItem(
                "guruai_users"
            ) || "[]"
        );


    const existing=
        users.find(
            user=>user.email===email
        );


    if(existing){

        showMessage(
            "An account with this email already exists."
        );

        return;

    }


    users.push({

        name:name,

        email:email,

        password:password

    });


    localStorage.setItem(
        "guruai_users",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "guruai_current_user",
        JSON.stringify({
            name:name,
            email:email
        })
    );


    showMessage(
        "Account created successfully! Opening GURUAI..."
    );


    setTimeout(()=>{

        window.location.href="index.html";

    },800);

}


/* LOGIN */

function login(){

    const email=
        document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

    const password=
        document
        .getElementById("loginPassword")
        .value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password."
        );

        return;

    }


    const users=
        JSON.parse(
            localStorage.getItem(
                "guruai_users"
            ) || "[]"
        );


    const user=
        users.find(
            item=>
                item.email===email &&
                item.password===password
        );


    if(!user){

        showMessage(
            "Incorrect email or password."
        );

        return;

    }


    localStorage.setItem(
        "guruai_current_user",
        JSON.stringify({
            name:user.name,
            email:user.email
        })
    );


    showMessage(
        "Login successful! Opening GURUAI..."
    );


    setTimeout(()=>{

        window.location.href="index.html";

    },500);

}

</script>

</body>
</html>
