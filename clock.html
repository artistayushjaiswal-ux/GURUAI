<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GURUAI World Clock</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; background: #08090d; }
    .clock-app { width: min(100%, 980px); }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); }
    header p { margin: 8px 0 0; color: #858c9c; }
    .live { color: #5ce28f; font-size: 12px; white-space: nowrap; }
    .clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .clock { padding: 24px; border: 1px solid #292d38; border-radius: 18px; background: linear-gradient(145deg, #141721, #0e1017); box-shadow: 0 12px 30px #0004; }
    .clock h2 { margin: 0 0 8px; font-size: 18px; }
    .zone { color: #777f91; font-size: 12px; margin-bottom: 20px; }
    time { display: block; font: 700 clamp(26px, 4vw, 38px)/1.1 monospace; letter-spacing: 1px; }
    .date { margin-top: 12px; color: #aeb5c3; font-size: 13px; }
    @media (max-width: 560px) { header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="clock-app" aria-live="polite">
    <header>
      <div>
        <h1>GURUAI World Clock</h1>
        <p>Current time around the world</p>
      </div>
      <div class="live">● LIVE</div>
    </header>
    <section class="clocks" id="clocks"></section>
  </main>
  <script>
    const zones = [
      { city: 'New York', zone: 'America/New_York' },
      { city: 'London', zone: 'Europe/London' },
      { city: 'Dubai', zone: 'Asia/Dubai' },
      { city: 'New Delhi', zone: 'Asia/Kolkata' },
      { city: 'Singapore', zone: 'Asia/Singapore' },
      { city: 'Tokyo', zone: 'Asia/Tokyo' },
      { city: 'Sydney', zone: 'Australia/Sydney' }
    ];

    const clocks = document.getElementById('clocks');
    const formatter = (zone, options) => new Intl.DateTimeFormat(undefined, { timeZone: zone, ...options });

    clocks.innerHTML = zones.map(({ city, zone }) => `
      <article class="clock">
        <h2>${city}</h2>
        <div class="zone">${zone.replace('_', ' ')}</div>
        <time data-zone="${zone}" aria-label="Current time in ${city}"></time>
        <div class="date" data-date-zone="${zone}"></div>
      </article>
    `).join('');

    function updateClocks() {
      const now = new Date();
      document.querySelectorAll('time[data-zone]').forEach((element) => {
        element.textContent = formatter(element.dataset.zone, {
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).format(now);
      });
      document.querySelectorAll('[data-date-zone]').forEach((element) => {
        element.textContent = formatter(element.dataset.dateZone, {
          weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
        }).format(now);
      });
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
